# Sample config file (TOML or YAML), read by the `tree` binary.
# The paths are kept at dust's locations for compatibility:
#   $XDG_CONFIG_HOME/dust/config.toml  (default ~/.config/dust/config.toml)
#   ~/.dust.toml
#
# Keys use the long flag name in kebab-case. Walker/color/depth keys apply to
# both output styles; display-only keys (bars, reverse, skip-total, ...) apply
# to `--style dust` only. `--style`, `--sort`, `--f`, and the positional depth
# are command-line only.

# Print tree upside down (biggest highest)
reverse=true

# Subdirectories will not have their path shortened
display-full-paths=true

# Use file length instead of blocks
display-apparent-size=true

# No colors will be printed
no-colors=true

# No percent bars or percentages will be displayed
no-bars=true

# No total row will be displayed
skip-total=true

# Do not display hidden files
ignore-hidden=true

# Only count files and directories on the same filesystem as the supplied directory
limit-filesystem=true

# print sizes in powers of 1000 (e.g., 1.1G)
output-format="si"

number-of-lines=5   

# To keep the .git directory collapsed
collapse=[".git"]
