[package]
name = "du-dust"
description = "A fast, folders-first directory tree with sizes (dust fork)"
version = "1.2.6"
authors = ["bootandy <bootandy@gmail.com>", "nebkor <code@ardent.nebcorp.com>"]
edition = "2024"
readme = "README.md"

documentation = "https://github.com/willktech/tree"
homepage = "https://github.com/willktech/tree"
repository = "https://github.com/willktech/tree"

keywords = ["du", "command-line", "disk", "disk-usage", "tree"]
categories = ["command-line-utilities"]
license = "Apache-2.0"

[badges]
travis-ci = { repository = "https://travis-ci.org/bootandy/dust" }

[[bin]]
name = "tree"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
lscolors = "0.21"
nu-ansi-term = "0.50"
terminal_size = "0.4"
unicode-width = "0.2"
rayon = "1"
thousands = "0.2"
stfu8 = "0.2"
regex = "1"
config-file = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
ctrlc = "3"
chrono = "0.4"
rustc-hash = "2"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.4"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
filesize = "0.2.0"

[dev-dependencies]
assert_cmd = "2"
tempfile = "=3"
criterion = "0.8"

[[bench]]
name = "scan_render"
harness = false

[build-dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
clap_mangen = "0.3"

[[test]]
name = "integration"
path = "tests/tests.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tree-v{ version }-{ target }{ archive-suffix }"
bin-dir = "tree-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.deb]
section = "utils"
assets = [
  [
    "target/release/tree",
    "usr/bin/",
    "755",
  ],
  [
    "LICENSE",
    "usr/share/doc/du-dust/",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/du-dust/README",
    "644",
  ],
  [
    "man-page/tree.1",
    "usr/share/man/man1/tree.1",
    "644",
  ],
  [
    "completions/tree.bash",
    "usr/share/bash-completion/completions/tree",
    "644",
  ],
]
extended-description = """\
tree gives you an instant overview of which folders are using disk space.
Folders are listed by default; --f also lists files. It is a fork of dust:
the upstream percent-bar output remains available with --style dust.
"""
